<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>じゃんけん</title>
</head>
<body>

<header>
  <h1>じゃんけん</h1>
</header>

<main>
  <div id="left_area">
    <ul>
      <li id="gu_btn"><img src = "/img/gu2.png"></li>
      <li id="cho_btn"><img src = "/img/choki.png"></li>
      <li id="par_btn"><img src = "/img/pa.png"></li>
    </ul>
    <div id="judgement">勝ち</div>
    <img id="result_img" style="display:none">
  </div>
  <div id="right_area">
    <div id="pc_row">コンピュータの出した手は？<span id="pc_hands">なに？</span></div>
    <img id="robo_img" style="display:none">
  </div>
</main>

<footer></footer>
<script>
//じゃんけん用のSCRIPTを書いてください
//勝敗の文字と画像を表示
const resultImgs = {
    "勝ち": "human_won.jpeg",
    "負け": "human_lost.jpeg",
    "あいこ": "human_draw.jpeg"
};
const roboImgs = {
    "勝ち": "robo_lost2.jpeg",
    "負け": "robo_won2.jpeg",
    "あいこ": "robo_draw2.jpg"
};
function showResult(result){
    $("#judgement").html(result);
    $("#result_img").attr("src", "/img/" + resultImgs[result]).show(); //勝敗の文字と画像を表示
    $("#robo_img").attr("src", "/img/" + roboImgs[result]).show(); //勝敗の文字と画像を表示
}

//グーボタン
$("#gu_btn").on("click",function(){
    $("li").removeClass("gray");
    $("#cho_btn, #par_btn").addClass("gray");
    const r = Math.random();
    const n = Math.ceil(r*3);
    console.log(n); //0.000001-0.000009

    if(n==1){
        $("#pc_hands").html('<img src="/img/gu2.png">');
        showResult("あいこ")
    }
    if(n==2){
        $("#pc_hands").html('<img src="/img/choki.png">');
        showResult("勝ち")
    }
    if(n==3){
        $("#pc_hands").html('<img src="/img/pa.png">');
        showResult("負け")
    }
  });

//チョキボタン
$("#cho_btn").on("click",function(){
    $("li").removeClass("gray");
    $("#gu_btn, #par_btn").addClass("gray");
    const r = Math.random();
    const n = Math.ceil(r*3);
    console.log(n); //0.000001-0.000009

    if(n==1){
        $("#pc_hands").html('<img src="/img/gu2.png">');
        showResult("負け")
    }
    if(n==2){
        $("#pc_hands").html('<img src="/img/choki.png">');
        showResult("あいこ")
    }
    if(n==3){
        $("#pc_hands").html('<img src="/img/pa.png">');
        showResult("勝ち")
    }
  });

//パーボタン
$("#par_btn").on("click",function(){
    $("li").removeClass("gray");
    $("#gu_btn, #cho_btn").addClass("gray");
    const r = Math.random();
    const n = Math.ceil(r*3);
    console.log(n); //0.000001-0.000009

    if(n==1){
        $("#pc_hands").html('<img src="/img/gu2.png">');
        showResult("勝ち")
    }
    if(n==2){
        $("#pc_hands").html('<img src="/img/choki.png">');
        showResult("負け")
    }
    if(n==3){
        $("#pc_hands").html('<img src="/img/pa.png">');
        showResult("あいこ")
    }
  });    

</script>
</body>
</html>
