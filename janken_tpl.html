<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>じゃんけん</title>
</head>
<body>

<header>
  <h1>じゃんけん</h1>
</header>

<main>
  <div id="left_area">
    <div id="camera_area">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <ul>
      <li id="gu_btn"><img src = "/img/gu2.png"></li>
      <li id="cho_btn"><img src = "/img/choki.png"></li>
      <li id="par_btn"><img src = "/img/pa.png"></li>
    </ul>
    <div id="judgement"></div>
  </div>
  <div id="right_area">
    <div id="control_area">
      <div id="status">カメラを準備中...</div>
      <div id="detected">認識中の手：<span id="detected_hand">-</span></div>
      <button id="start_btn" disabled>じゃんけんスタート</button>
      <div id="countdown"></div>
    </div>
    <div id="pc_row">コンピュータの出した手は？<span id="pc_hands">なに？</span></div>
    <img id="robo_img" style="display:none">
  </div>
</main>

<footer></footer>
<script type="module">
import { FilesetResolver, HandLandmarker, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

//勝敗の文字と背景色・画像を表示
const resultClasses = {
    "勝ち": "result-win",
    "負け": "result-lose",
    "あいこ": "result-draw"
};
const roboImgs = {
    "勝ち": "robo_lost2.jpeg",
    "負け": "robo_won2.jpeg",
    "あいこ": "robo_draw2.jpg"
};
function showResult(result){
    $("#judgement").html(result);
    $("body").removeClass("result-win result-lose result-draw")
             .addClass(resultClasses[result]); //背景色で人間の勝敗を表現
    $("#robo_img").attr("src", "/img/" + roboImgs[result]).show();
}

// 手の定義 (0:グー 1:チョキ 2:パー)
const HANDS = [
    { name: "グー",   btn: "#gu_btn",  img: "/img/gu2.png"   },
    { name: "チョキ", btn: "#cho_btn", img: "/img/choki.png" },
    { name: "パー",   btn: "#par_btn", img: "/img/pa.png"    }
];

// じゃんけん本体：player = 0/1/2
function play(player){
    $("li").addClass("gray");
    $(HANDS[player].btn).removeClass("gray");

    const pc = Math.floor(Math.random() * 3);
    $("#pc_hands").html('<img src="' + HANDS[pc].img + '">');

    // (player - pc + 3) % 3 → 0:あいこ 1:負け 2:勝ち
    const diff = (player - pc + 3) % 3;
    showResult(["あいこ", "負け", "勝ち"][diff]);
}

// ===== カメラ & 手の認識 =====
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const drawingUtils = new DrawingUtils(ctx);
let handLandmarker = null;
let currentHand = null;   // 現在認識している手 (0/1/2 or null)
let lastVideoTime = -1;

// 指が伸びているか：指先が第2関節より手首から遠ければ「伸びている」
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function isExtended(lm, tip, pip){
    return dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.1;
}
// ランドマークからグー/チョキ/パーを判定
function classify(lm){
    const index  = isExtended(lm, 8, 6);
    const middle = isExtended(lm, 12, 10);
    const ring   = isExtended(lm, 16, 14);
    const pinky  = isExtended(lm, 20, 18);
    const count = [index, middle, ring, pinky].filter(Boolean).length;

    if (index && middle && !ring && !pinky) return 1; // チョキ
    if (count >= 3) return 2;                          // パー
    if (count === 0) return 0;                         // グー
    return null;                                       // 判定できない
}

async function setup(){
    try {
        const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: "GPU"
            },
            runningMode: "VIDEO",
            numHands: 1
        });
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
            $("#status").text("カメラに手をかざしてください");
            $("#start_btn").prop("disabled", false);
            requestAnimationFrame(detectLoop);
        });
    } catch (e) {
        console.error(e);
        $("#status").text("カメラを起動できませんでした：" + e.message);
    }
}

function detectLoop(){
    if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const res = handLandmarker.detectForVideo(video, performance.now());
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (res.landmarks.length > 0) {
            const lm = res.landmarks[0];
            drawingUtils.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, { color: "#00FF00", lineWidth: 3 });
            drawingUtils.drawLandmarks(lm, { color: "#FF0000", lineWidth: 1 });
            currentHand = classify(lm);
        } else {
            currentHand = null;
        }
        $("#detected_hand").text(currentHand === null ? "-" : HANDS[currentHand].name);

        // 「ぽい！」の受付時間中に手を認識したら、その手で勝負
        if (judging && currentHand !== null) {
            finishJudge(currentHand);
        }
    }
    requestAnimationFrame(detectLoop);
}

// ===== 後出し判定 =====
const LATE_LIMIT_MS = 200;  // 「ぽい！」から手を出すまでの猶予
let judging = false;        // 手の受付中かどうか
let lateTimer = null;

// 「ぽい！」の瞬間に呼ぶ：すでに手が出ていれば即勝負、なければ0.2秒だけ待つ
function startJudge(){
    judging = true;
    if (currentHand !== null) {
        finishJudge(currentHand);
        return;
    }
    lateTimer = setTimeout(() => {
        if (judging) finishJudge(null);  // 0.2秒以内に手が出なかった
    }, LATE_LIMIT_MS);
}

function finishJudge(hand){
    judging = false;
    clearTimeout(lateTimer);
    if (hand === null) {
        loseByLate();
    } else {
        play(hand);
    }
    $("#start_btn").prop("disabled", false);
}

// 後出しによる負け
function loseByLate(){
    $("li").addClass("gray");  // 人間の手はなし
    const pc = Math.floor(Math.random() * 3);
    $("#pc_hands").html('<img src="' + HANDS[pc].img + '">');
    showResult("負け");
    $("#judgement").html("後出しだから負け");
    $("#countdown").text("「ぽい！」から0.2秒以内に手を出そう");
}

// スタートボタン：「じゃん・けん・ぽい！」のタイミングで認識中の手を出す
$("#start_btn").on("click", function(){
    $(this).prop("disabled", true);
    $("li").removeClass("gray");
    $("#robo_img").hide();
    $("body").removeClass("result-win result-lose result-draw");
    $("#judgement").text("");
    $("#pc_hands").text("なに？");

    const words = ["じゃん", "けん", "ぽい！"];
    let i = 0;
    $("#countdown").text(words[i]);
    const timer = setInterval(() => {
        i++;
        $("#countdown").text(words[i]);
        if (i === words.length - 1) {
            clearInterval(timer);
            startJudge();
        }
    }, 800);
});

setup();
</script>
</body>
</html>
